{% load static %}
<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content=""> {% if title %}
    <title>{{title}}</title>
    {% endif %}


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous" />
    <link rel="stylesheet" type="text/css" href="{% static 'Resto/myorder.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">

    <!-- Custom styles for this template -->
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">

    <script type="text/javascript">
        //Get current user
        var user = '{{request.user}}'

        //CSRF TOKEN
        function getToken(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getToken('csrftoken');
    </script>

</head>

<body>

    <div class="container">
        <header class="blog-header py-5">
            <div class="align-items-center">

                <div class="col text-center">
                    <a class="blog-header-logo text-dark" href="/bakerys/?session={{app}}">
                        <img src="{% static 'Resto/Bakerys Logo.JPG' %}" style="width: 130px; height: 130px; object-fit: scale-down;image-rendering: auto;
                    flex: auto;text-align: center;">
                    </a>
                </div>
                <div class="col-4  inline-block">
                    <a class="btn btn-sm btn-outline-secondary " href="/bakerys/?session={{app}}"><i class="bi bi-arrow-left-square"></i> Menu</a> {% if del_item %}
                    <a class="btn btn-sm btn-outline-secondary  "href="/bakerys/myorder/?session={{app}}"><i class="bi bi-arrow-left-square"></i> My Order </a> {% endif %}

                </div>
            </div>
        </header>


        <div class="col-12">
            {% if messages %} {% for message in messages %}
            <div class='alert alert-{{message.tags}} alert-dismissible' style="text-align: center;" role="alert">
                <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Success:"><use xlink:href="#check-circle-fill"/></svg> {{message}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %} {% endif %}
        </div>



        <main role="main" class="container">
            <div class="row">

                {% block content %} {% endblock content %}
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
        <script type="text/javascript" src="{% static 'Resto/JavaScript/sendOrder_bakerys.js'%}"></script>
        <script type="text/javascript" src="{% static 'Resto/JavaScript/cart_bakerys.js'%}"></script>
</body>

</html>
