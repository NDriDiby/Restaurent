 {% block content %} {% load static %} {% load crispy_forms_tags %}

<link rel="stylesheet" type="text/css" href="{% static 'Resto/login.css' %}">


<div class='bold-line'></div>
<div class='container'>
    <div class='window'>
        <div class='overlay'></div>
        <div class='content'>
            <div class='welcome'>Hello There!</div>
            <div class='subtitle'>We're almost done. Before using our services you need to create an account.</div>
            <div class='input-fields'>
                <label for="{{form.username_for_label}}" class="form-label">Username</label>
                <input type='text' placeholder='Username' class='input-line full-width'>{{form.username}}</input>
                <input type='email' placeholder='Email' class='input-line full-width'></input>
                <input type='password' placeholder='Password' class='input-line full-width'></input>
            </div>
            <div class='spacing'>or continue with <span class='highlight'>Facebook</span></div>
            <div><button class='ghost-round full-width'>Create Account</button></div>
        </div>
    </div>
</div>



<div class='container py-5'>
    <div>
        <form method='POST' style='text-align: center'>
            {% csrf_token %}
            <fieldset class='form-group'>
                <legend class='border-bottom mb-4;' style="text-align:center ;">Connexion</legend>
                {{form|crispy}}
            </fieldset>
            <div class='form-group mt-3' style="text-align:center;">
                <button type="submit" class='btn btn-outline-info'> Connect</button>
            </div>
        </form>
    </div>
</div>

{% endblock content %}
