
{% extends "Customer/base_login.html" %}{% load static %} 

{% block content %}

<h4 class='mt-2' style="color: sandybrown">
    Icarus
    <small class="text-muted"
      ><i> <strong> Bar & Restaurant</strong> </i></small
    >
  </h4>
  <small class="text-muted" style="padding-left: 10px">Thank you for using our service.</small>
  
  <h1>Login</h1>
  <form method="POST"  nonvalidate>
          {% csrf_token %}
            <div class="one">
                <label style="padding-right: 225px;" for="Email">Email</label><br>
                <input type="text" placeholder="Type your email" {{form.username}} <br>
            </div>
            <div class="two">
                <label style="padding-right: 195px;" for="Password">Password</label><br>
                <input type="password"  placeholder="Type your password" {{form.password}}
            </div>

            <button type ='submit' >Login</button>
      
        <a style="text-decoration: none;" href="/changePassword/?session={{app}}"><p style="text-align: 50px; margin-top:10px" id="forget">Forgot password?</p></a>
        
        <div class="middle">
            <p>Or Sign Up Using</p>
            <div class="icons">
                <a href="google.com"><i class="fab fa-facebook"></i></a>
                <i class="fab fa-twitter"></i>
                <i class="fab fa-google"></i>
                <i class="fab fa-instagram"></i>
                <i class="fab fa-linkedin"></i>
            </div>
        </div>

        <div class="bottom" type='submit'>
            <p>Join Icarus Today!</p><br>
            <span id="span"><a class="ml-2" style="text-decoration: none;" href="/register/?session={{app}}">REGISTER</a></span>
        </div>
    </div>
  </form>

{% endblock content %}
