{% extends "Customer/base_login.html" %}{% load static %} {% load crispy_forms_tags %}{% block content %}

<h4 class="mt-2" style="color: sandybrown">
  Icarus
  <small class="text-muted"
    ><i> <strong> Bar & Restaurant</strong> </i></small
  >
</h4>

<small class="text-muted" style="padding-left: 10px">Thank you for using our service.</small>

<h1>Login</h1>

<form method="POST" id="login">
  {% csrf_token %}
  <div class="one">
    <i class="fas fa-envelope"></i>
    <label style="padding-right: 225px" for="Email">Email</label><br />
    <input type="text" placeholder="Type your email" {{form.username}} <br />
  </div>
  <div class="two">
    <i class="fas fa-lock"></i>
    <label style="padding-right: 195px" for="Password">Password</label><br />
    <input type="password" placeholder="Type your password" {{form.password}}<br />
  </div>

  <a href="#"><p id="forget">Forgot password?</p></a>

  <button type="submit">Login</button>

  <!-- <div class="middle">
            <p>Or Sign Up Using</p>
            <div class="icons">
                <a href="google.com"><i class="fab fa-facebook"></i></a>
                <i class="fab fa-twitter"></i>
                <i class="fab fa-google"></i>
                <i class="fab fa-instagram"></i>
                <i class="fab fa-linkedin"></i>
            </div>
        </div>  -->

  <div class="bottom" type="submit">
    <p class="mt-3">Join Icarus Today!</p>
    <br />
    <span id="span"><a class="ml-2" style="text-decoration: none; color: white" href="/register/?session={{app}}">Register</a></span>
  </div>
</form>

{% endblock content %}
