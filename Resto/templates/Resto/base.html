<!DOCTYPE html>

{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous" />
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" /> -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Menu</title>
  </head>
  <body>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      div.gallery {
        border-radius: 10px;
        margin: 2px;
        box-shadow: 0 5px 10px hsla(0, 0%, 0%, 0.1);
        border: 1px solid rgb(163, 159, 159);
      }

      div.gallery:hover {
        border: 2px solid #777;
      }

      div.gallery img {
        border-radius: 5px 5px 0 0px;
        width: 100%;
        height: 100px;
        object-fit: cover;
      }

      div.desc {
        padding: 15px;
        text-align: center;
      }

      .username {
        background-color: rgb(108, 106, 106);
        border-radius: 3px;
        color: white;
        padding: 5px 10px;
      }

      {% comment %} .info {
        margin-top: 25px;
        width: 100%;
        height: 170px;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 12px;
      } {% endcomment %}

      .logofield .businessName {
        font-size: 25px;
        margin-left: 35px;
      }

      .blog-footer {
        padding: 2.5rem 0;
        color: #999;
        text-align: center;
        background-color: #f9f9f9;
        border-top: 0.05rem solid #e5e5e5;
      }

      .blog-footer p:last-child {
        margin-bottom: 0;
      }
      {% comment %} .mySlides {
        background-color: black;
        border-radius: 8px;
        box-shadow: 1px 3px 5px 0px rgba(0, 0, 0, 0.75);
        -webkit-box-shadow: 1px 3px 5px 0px rgba(0, 0, 0, 0.75);
        -moz-box-shadow: 1px 3px 5px 0px rgba(0, 0, 0, 0.75);
      } {% endcomment %}

      .notification-message {
        font-weight: bold;
      }
    </style>

    {% block content%} {% endblock content %}

    <script>
      var myIndex = 0;

      function imageSlider() {
        var mySlides = document.getElementsByClassName("mySlides");
        for (let i = 0; i < mySlides.length; i++) {
          mySlides[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > mySlides.length) {
          myIndex = 1;
        }
        mySlides[myIndex - 1].style.display = "block";
        setTimeout(imageSlider, 3000); // Change image every 3 seconds
      }

      imageSlider();

      //$('.notification-box').show()

      hideNotification();

      //hide elements notification
      function hideNotification() {
        $(".notification-box").click(function () {
          $(this).hide();
        });
      }

      // }
      // welcomeNotification();
      // hideNotification()
    </script>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
      crossorigin="anonymous"
    ></script>

    <!-- Body End here -->
  </body>
</html>
