{% extends "Resto/base.html" %} {% load static %} {% block content %}

<style>
  .menudetails {
    padding: 10px;
  }
</style>

<div class="p-3">
  <!-- UserBox -->
  <div class="flex justify-between userBox items-center">
    <div class="userfield">
      <a class="btn btn-sm btn-outline-secondary" href="/texasgrillz/?session={{app}}"><i class="bi bi-arrow-left-square"></i> Retour</a>
    </div>

    <div class="logofield w-20">
      <span class="businesslogo"
        ><a href="/texasgrillz/?session={{app}}"><img src="{% static 'Resto/TexasGrillzLogo.jpeg' %}" alt="" width="auto" height="60px" /></a
      ></span>
    </div>

    <div class="logOutfield">
      <div class="logOutlogo">
        {% if user.is_authenticated %}
        <a class="btn btn-sm btn-outline-secondary" href="/logout/?session={{app}}">Deconnexion</a> {% else%}
        <a class="btn btn-sm btn-outline-secondary" href="/login/?session={{app}}">Connexion</a> {% endif %}
      </div>
    </div>
  </div>
</div>

<div class="info my-3">
  <div class="text-white">
    <div class="mySlides relative">
      <img class="w-full h-40 sm:h-60 object-cover rounded-lg border-2 bg-gradient-to-r from-black to-gray-700 opacity-50" src="{{menu.img.url}}" />
      <div class="absolute top-0 left-0 font-bold p-2">
        <h1 class="italic">{{menu.name}}</h1>
        <p class="w-full text-xl pt-3">{{menu.description}}</p>
      </div>
    </div>
  </div>
</div>

<div class="menudetails">
  <div class="menudetails-content">
    {% for i in item %}
    <div class="menudetails-items">
      <div class="item-name">{{i.name}}</div>
      <div class="item-price">{{i.prix}}</div>
      <div class="item-description">{{i.description}}</div>
      <div class="item-image">
        <img src="{{i.img.url}}" />
      </div>
    </div>
    {% endfor %}
  </div>
  {% endblock content %}
</div>
