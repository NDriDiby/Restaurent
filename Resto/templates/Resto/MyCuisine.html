{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" />
    <!-- Boxicons CDN Link -->
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
      integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
  </head>
  <body>
    <style>
      .btn {
        background-color: chocolate;
        border-radius: 3px;
        color: white;
        padding: 5px 10px;
      }
    </style>
    <div class="container py-3">
      <div>CHECK</div>

      <div class="text-center mb-3">
        <div class="btn position-relative">
          <span style="font-size: 30px"> <i class="fas fa-utensils p-2"></i> Repas Incomplets</span>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 22px">
            <span id="total_uncompleted_order">{{uncompleted_order.count}}</span>
            <span class="visually-hidden">unread messages</span>
          </span>
        </div>
      </div>

      <!-- BackEnd Job -->
      <div id="data" class="row justify-content-start g-lg-3 align-items-lg-baseline mt-3"></div>
      <!-- BackEnd Job -->

      <div class="text-center mt-5">
        <div class="btn position-relative">
          <span style="font-size: 30px"> <i class="fas fa-utensils p-2"></i> Repas complets</span>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 22px">
            <span id="total_uncompleted_order">{{uncompleted_order.count}}</span>
            <span class="visually-hidden">unread messages</span>
          </span>
        </div>
      </div>
    </div>
  </body>

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
    crossorigin="anonymous"
  ></script>

  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>

  <script type="text/javascript" src="{% static 'Resto/JavaScript/MyCuisine.js'%}"></script>
</html>
