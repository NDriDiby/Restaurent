{% extends "Resto/base_menu.html" %} {% block content %} {% load static %}


<div class='container py-5' style="text-align: center;">
    <div class='heading__title'>
        <h1>{{menu.name}}</h1>

    </div>

    <div class='row row-cols g-3 mt-5'>
        {% for i in item %}
        <div class='col-4 mb-5'>
            <h2 style="color: tomato;">{{i.name}}</h2>
            <div class='mb-2'>
                <p>{{i.description}}</p>
                <b><p>{{i.prix}} FCFA</p></b>
            </div>

        </div>
        {% endfor %}
    </div>
    <hr>
</div>

{%endblock content%}
