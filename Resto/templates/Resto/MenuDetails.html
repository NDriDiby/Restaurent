{% extends "Resto/base_menu.html" %} {% block content %} {% load static %}

<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <symbol id="check-circle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
  </symbol>
  <symbol id="info-fill" fill="currentColor" viewBox="0 0 16 16">
    <path
      d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"
    />
  </symbol>
  <symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
    <path
      d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
    />
  </symbol>
</svg>

<div class="col-12">
  {% if messages %} {% for message in messages %}
  <div class="alert alert-{{message.tags}} alert-dismissible" style="text-align: center" role="alert">
    <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Success:">
      <use xlink:href="#check-circle-fill" />
    </svg>
    {{message}}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %} {% endif %}
</div>

<div class="container py-3">
  <div class="heading__title">
    <h1 style="text-align: center">{{menu.name}}</h1>
  </div>
  <div class="row justify-content-evenly g-lg-3 align-items-lg-baseline">
    <div class="card card-6 mt-3"><!--effect .card in main.css-->
      {% for i in item %}
        <div class="col-sm-12 pb-1"> <!--col-md-6 col-lg-3-->
          <a href="/texasgrillz/itemdetails/{{i.id}}/?session={{app}}" style="text-decoration: none;color:black">
            <div class="card" style="border: none;">
              <div class="card-body">
                <div class="row">
                  <div class="col-8"><h5 class="card-title" style="color:brown;">{{i.name}}</h5>
                    <p class="card-text">{{ i.description }}</p>
                    <p class="card-text text-muted"><strong>{{i.prix }} FCFA</strong></p>
                  </div>
                  <div class="col-4" style="margin: 0px; padding-left: 0px;"><img src="{{i.img.url }}" class="card-img-top" alt="{{i.name}}" 
                    style="width: 100%; height: auto; object-fit: scale-down; image-rendering: auto; text-align:center;"/> 
                  </div>
                </div>
              </div>
            </div>
          </a>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock content %}
